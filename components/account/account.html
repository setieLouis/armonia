<div class="acc-container mobile-container">
    <!-- Header Placeholder -->
    <div id="acc-header-root"></div>

    <div class="acc-content scrollable-content">
        <!-- Sezione Profilo -->
        <div class="acc-section">
            <h3 class="acc-section-title">👤 Informazioni Personali</h3>
            <div class="acc-card">
                <div class="acc-row">
                    <div class="acc-row-info">
                        <span class="acc-row-label">Nome</span>
                        <span class="acc-row-value" id="acc-name-value">...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sezione Tecnica -->
        <div class="acc-section">
            <h3 class="acc-section-title">⚙️ Dati Tecnici</h3>
            <div class="acc-card">
                <div class="acc-row">
                    <div class="acc-row-info">
                        <span class="acc-row-label">ID Utente (UID)</span>
                        <span class="acc-row-value acc-row-value--code" id="acc-uid-value">...</span>
                    </div>
                    <button class="acc-copy-btn" data-target="acc-uid-value">📋</button>
                </div>

                <div class="acc-divider"></div>

                <div class="acc-row">
                    <div class="acc-row-info">
                        <span class="acc-row-label">FCM Token</span>
                        <span class="acc-row-value acc-row-value--code" id="acc-fcm-value">...</span>
                    </div>
                    <button class="acc-copy-btn" data-target="acc-fcm-value">📋</button>
                </div>
            </div>
        </div>

        <div class="acc-footer">
            <p>Versione 1.0.0 - Armonia Flow</p>
        </div>
    </div>
</div>
